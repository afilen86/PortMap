name: Build macOS Orbit app

on:
  push:
    branches: [macos-orbit-app]
  pull_request:
    paths:
      [
        "port-map-source/**",
        "web/native/**",
        "web/design-tools/**",
        "build.sh",
        ".github/workflows/macos-app.yml",
      ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile universal app, validate WebKit bridge, and package
        shell: bash
        run: |
          set -o pipefail
          ./build.sh --universal --smoke-test --zip 2>&1 | tee "$RUNNER_TEMP/macos-build.log"
      - name: Report build diagnostics
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os, pathlib
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'macos-build.log'
          text = log.read_text() if log.exists() else 'Build command did not start.'
          errors = [line for line in text.splitlines() if 'error:' in line.lower() or 'test failed' in line.lower()]
          for line in errors[:20]:
              escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=macOS build::' + escaped)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## macOS build output\n\n```text\n' + text[-60000:] + '\n```\n')
          PYCODE
      - name: Upload app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PortMap-macOS-universal
          path: build/PortMap-*-build*.zip
          if-no-files-found: error
      - name: Publish tested macOS beta
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' port-map-source/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' port-map-source/Info.plist)
          tag="macos-orbit-v${version}-build${build}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This app version is already published; keeping its existing assets."
          else
            (cd build && shasum -a 256 "PortMap-${version}-build${build}.zip" > "PortMap-${version}-build${build}.zip.sha256")
            gh release create "$tag" "build/PortMap-${version}-build${build}.zip" "build/PortMap-${version}-build${build}.zip.sha256" \
              --target "$GITHUB_SHA" --prerelease --title "Port Map ${version} — Workspace Orbit beta" \
              --notes-file MACOS-RELEASE-NOTES.md
          fi
